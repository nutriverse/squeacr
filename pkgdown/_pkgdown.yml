title: squeacr

url: https://nutriverse.io/squeacr/

development:
  mode: auto

template:
  bootstrap: 5
  theme: breeze-light
  math-rendering: mathjax
  bslib:
    bootswatch: pulse
    pkgdown-nav-height: 100px
    success: "#004225"
  includes:
    in_header: |
      <!-- Google tag (gtag.js) -->
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-C6TYX2E6RD"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-C6TYX2E6RD');
      </script>

navbar:
  bg: success
  type: dark
  structure:
    left:  [home, intro, reference, articles, news]
    right: [search, website, mastodon, bluesky, linkedin, github]

  components:
    # articles:
    #   text: Articles
    #   menu:
    #   - text: "Detecting haemoglobinaemia"
    #     href: articles/haemoglobinaemia.html
    #   - text: "Detecting inflammation"
    #     href: articles/inflammation.html
    #   - text: "Detecting iron deficiency"
    #     href: articles/iron-deficiency.html
    #   - text: "Detecting iodine deficiency"
    #     href: articles/iodine-deficiency.html
    website:
      icon: "fa-globe"
      href: https://nutriverse.io
      aria-label: Website
    mastodon:
      icon: fab fa-mastodon fa-lg
      href: https://mastodon.social/@nutriverse
      aria-label: Mastodon
    bluesky:
      icon: "fab fa-bluesky fa-lg"
      href: https://bsky.app/profile/nutriverse.io
      aria-label: Bluesky
    linkedin:
      icon: "fab fa-linkedin fa-lg"
      href: https://www.linkedin.com/company/nutriverse-community
      aria-label: LinkedIn

home:
  links:
  - text: Read more about SQUEAC
    href: https://www.fantaproject.org/monitoring-and-evaluation/squeac-sleac

reference:
  - title: Performance indicators
    contents:
    - calculate_cured
    - calculate_dead
    - calculate_default
    - calculate_no_response
    - calculate_performance

  - title: Coverage estimators
    contents:
    - calculate_rout
    - calculate_cf
    - calculate_tc

  - title: MUAC-at-admission
